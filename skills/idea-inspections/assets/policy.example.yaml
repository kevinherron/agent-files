# Example inspection policy — copy to `.idea-inspections/policy.yaml` at the project root and trim.
#
# Each problem the IDE reports is matched against `rules` (first match wins) and assigned an action:
#   ignore   -> tolerated project-wide, no code change (the old "whitelist")
#   fix      -> always fix it
#   suppress -> always suppress it at the occurrence (correct report, intentional code)
#   auto     -> let the resolve agent decide fix vs suppress
# A problem no rule matches takes `default`. Zero-tolerance: nothing is dropped unless an action
# says `ignore`. Put specific / per-file rules ABOVE general ones.
#
# Matching: `description` is a regex over the IntelliJ message; `severity` and `paths` (globs, where
# ** spans directories) are optional narrowers.

default: auto

rules:
  # Duplicated-code warnings: parallel codec/serializer classes are intentionally symmetric.
  - description: "^Duplicated code fragment \\(\\d+ lines long\\)$"
    action: ignore
    reason: "Parallel codec classes are intentionally symmetric."

  # Unused *public API* declarations: callers live outside this repo. Suppress locally (narrowed to
  # the API surface) rather than delete, so genuinely-dead private code is still fixed elsewhere.
  - description: "^Method '[^']*' is never used$"
    action: suppress
    suppressId: unused
    paths:
      - "**/api/**"
      - "**/*Api.java"
    reason: "Public API surface; external callers."

  # Always modernize these mechanical patterns.
  - description: "^Switch statement can be replaced with enhanced 'switch'$"
    action: fix
    reason: "Modernize switch statements."

  # Example per-file override (disabled by default — uncomment and adjust):
  # - description: "^'Optional<.*>' used as type for parameter '.*'$"
  #   action: suppress
  #   paths: ["**/LegacyApi.java"]
  #   reason: "This API deliberately accepts Optional."
